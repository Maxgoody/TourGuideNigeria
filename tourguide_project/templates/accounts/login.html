{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login — TourGuide Nigeria{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-4"><i class="bi bi-person-circle text-primary"></i> Login</h3>
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-primary btn-lg">Login</button>
            </div>
          </form>
          <hr>
          <p class="text-center mb-1">New here? <a href="{% url 'accounts:register_tourist' %}">Register as Tourist</a></p>
          <p class="text-center mb-0">Want to be a guide? <a href="{% url 'accounts:register_guide' %}">Register as Guide</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
