{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ action }} Experience — TourGuide Nigeria{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h3 class="fw-bold mb-4"><i class="bi bi-compass text-success me-2"></i>{{ action }} Experience</h3>
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-2 mt-3">
              <button type="submit" class="btn btn-success px-4">{{ action }} Experience</button>
              <a href="{% url 'accounts:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
